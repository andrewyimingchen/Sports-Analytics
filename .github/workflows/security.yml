name: Security

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - uv.lock
      - pyproject.toml
      - package.json
      - package-lock.json
      - mobile/package.json
      - mobile/package-lock.json
      - .github/workflows/security.yml

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Export locked dependencies
        run: uv export --frozen --all-extras --all-groups --no-hashes --no-emit-project > requirements-audit.txt
      - name: Audit Python dependencies
        run: uvx pip-audit --requirement requirements-audit.txt --progress-spinner off

  pwa-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit PWA tooling
        run: npm audit --audit-level=high

  mobile:
    runs-on: ubuntu-latest
    # Reported, not blocking: Expo's CLI/Metro advisories have no non-breaking
    # fix yet (Sports-Analytics-1xp.7.1 tracks triage). Remove once resolved.
    continue-on-error: true
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit mobile dependencies
        run: |
          npm audit --audit-level=high | tee audit.txt
          { echo "### Mobile npm audit"; echo '```'; tail -20 audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
