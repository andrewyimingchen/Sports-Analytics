name: Security

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - uv.lock
      - pyproject.toml
      - package.json
      - package-lock.json
      - mobile/package.json
      - mobile/package-lock.json
      - .github/workflows/security.yml

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Export locked dependencies
        run: uv export --frozen --all-extras --all-groups --no-hashes --no-emit-project > requirements-audit.txt
      - name: Audit Python dependencies
        run: uvx pip-audit --requirement requirements-audit.txt --progress-spinner off

  pwa-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit PWA tooling
        run: npm audit --audit-level=high

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Reported, not blocking: Expo's CLI/Metro advisories have no
      # non-breaking fix yet (Sports-Analytics-1xp.7.1). Findings raise a
      # warning annotation; make this step fail once triage is done.
      - name: Audit mobile dependencies (non-blocking)
        run: |
          if npm audit --audit-level=high > audit.txt; then
            echo "No high-severity mobile advisories."
          else
            echo "::warning title=Mobile npm audit::$(grep -E 'vulnerabilit' audit.txt | tail -1) - see Sports-Analytics-1xp.7.1"
          fi
          { echo "### Mobile npm audit"; echo '```'; tail -20 audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
