name: Security

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - uv.lock
      - pyproject.toml
      - package.json
      - package-lock.json
      - mobile/package.json
      - mobile/package-lock.json
      - .github/workflows/security.yml
      - .github/scripts/npm-audit-report.mjs

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Export locked dependencies
        run: uv export --frozen --all-extras --all-groups --no-hashes --no-emit-project > requirements-audit.txt
      - name: Audit Python dependencies
        run: uvx pip-audit==2.10.1 --requirement requirements-audit.txt --progress-spinner off

  pwa-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit PWA tooling
        run: npm audit --audit-level=high

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Findings are reported, not blocking. After the 2026-10 non-breaking
      # fix (no criticals; 33 left), the remainder sit in Expo SDK 56's
      # CLI/Metro toolchain and need an SDK upgrade, not npm's "fix" (a
      # downgrade to Expo 44). A failed audit (registry outage, missing
      # lockfile, CLI error) still fails the job.
      - name: Audit mobile dependencies (findings non-blocking)
        run: |
          set +e
          npm audit --audit-level=high --json > audit.json 2> audit.err
          set -e
          if ! node ../.github/scripts/npm-audit-report.mjs audit.json audit-summary.txt Sports-Analytics-1xp.18; then
            cat audit.err >&2
            exit 1
          fi
          { echo "### Mobile npm audit"; cat audit-summary.txt; } >> "$GITHUB_STEP_SUMMARY"
