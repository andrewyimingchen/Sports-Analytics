name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >= 3.11
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python }}
      - name: Format
        run: uv run --frozen ruff format --check .
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Type check
        run: uv run --frozen mypy
      - name: Test with coverage
        run: uv run --frozen pytest -q --cov --cov-report=term --cov-report=xml
      - name: Coverage summary
        if: always() && matrix.python == '3.12'
        run: |
          {
            echo "### Coverage (Python ${{ matrix.python }})"
            echo
            echo '```'
            uv run --frozen coverage report --skip-covered | tail -25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install PWA tooling
        run: npm ci --no-audit --no-fund
      - name: Lint PWA
        run: npm run lint
      - name: Unit-test rendering helpers
        run: npm test

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen --group browser
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Browser tests (charts, keyboard, phone layout, offline)
        run: uv run pytest -q tests/test_pwa_browser.py

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production PWA image
        run: docker build --tag possession-lab:test .
      - name: Start production PWA image
        run: docker run --detach --name possession-lab --publish 8000:8000 possession-lab:test
      - name: Wait for liveness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs possession-lab
          exit 1
      - name: Verify readiness and PWA shell
        run: |
          curl --fail --silent http://127.0.0.1:8000/readyz | grep --quiet '"status":"ready"'
          curl --fail --silent http://127.0.0.1:8000/app/ | grep --quiet 'POSSESSION LAB'
      - name: Stop container
        if: always()
        run: docker rm --force possession-lab || true

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
