version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      eslint:
        patterns: [eslint, "@eslint/*", globals]
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Expo pins these per SDK (`npx expo install --check`); bumping them alone
    # breaks compatibility. They move together in SDK upgrades via
    # `npx expo install expo@^<sdk> --fix` (see mobile/README.md).
    ignore:
      - dependency-name: expo
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: typescript
      - dependency-name: "@types/react"
      - dependency-name: eslint-config-expo
      # eslint-config-expo's bundled eslint-plugin-react breaks on ESLint 10
      # (context.getFilename was removed); keep 9.x until Expo's config moves.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
