[project]
name = "nba-insights"
version = "0.1.0"
description = "NBA player intelligence: live player profiles, form trends, shot charts, and comparisons built on nba_api"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "lxml>=6.1.1",
    "nba_api>=1.7",
    "pandas>=2.0",
    "pillow>=12.3.0",
    "plotly>=5.20",
    "pyarrow>=15",
    "scikit-learn>=1.5",
    "streamlit>=1.35",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# AI Q&A ("Ask" page) — optional so the core app stays free and offline.
# Enable with `uv sync --extra ai` and set ANTHROPIC_API_KEY.
ai = ["anthropic>=0.69"]

[dependency-groups]
browser = [
    "axe-playwright-python>=0.1.8",
    "playwright>=1.48",
]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nba_insights"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# Agreed strictness (1xp.7): defaults plus checking unannotated bodies, over
# the shipped package. pandas-stubs is deliberately not installed — it flags
# pandas' dynamic API far more than it finds bugs here.
python_version = "3.11"
files = ["src/nba_insights"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.coverage.run]
source = ["nba_insights"]

[tool.coverage.report]
# Pragmatic floor (1xp.7): measured 86% on 2026-10-06 without the data cache
# or browser suite. Raise it as coverage grows; never lower it to pass CI.
fail_under = 80
skip_covered = true
show_missing = true
